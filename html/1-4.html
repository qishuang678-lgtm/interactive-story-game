<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/1-4.css">
    <title>游戏界面</title>
    <style>
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            overflow: hidden;
        }
        
        /* 视频样式 */
        .background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover; 
        }
    </style>

    <style>
    /* 爆炸效果相关样式 */
    .explosion {
        animation: explode 0.8s ease-out forwards;
        display: inline-block;
    }

    @keyframes explode {
        0% {
            transform: scale(1);
            opacity: 1;
            color: white;
        }
        50% {
            transform: scale(10.0) rotate(5deg);
            opacity: 0.9;
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.8);
        }
        100% {
            transform: scale(1);
            opacity: 1;
            color: white;
        }
    }

    /* 单个文字的随机爆炸效果 */
    .char-explode {
        display: inline-block;
        animation: charExplode 0.6s ease-out forwards;
        font-size: 24px; 
        line-height: 1.2; 
    }

    @keyframes charExplode {
        0% {
            transform: scale(1) translate(0, 0);
            opacity: 1;
        }
        50% {
            opacity: 0.9;
            color: #ff4d4d;
        }
        100% {
            transform: scale(1) translate(0, 0);
            opacity: 1;
        }
    }
</style>
</head>

<body>
    <div class="background-container">
        <video class="background-video" autoplay muted playsinline onended="this.pause();">
            <source src="..\videos\击打视频.mp4" type="video/mp4">
        </video>
    </div>
    
    <!-- 角色立绘容器 -->
    <div class="character-container left">
        <img class="character-image" id="left-character-image" src="" alt="左侧角色">
    </div>
    <div class="character-container right">
        <img class="character-image" id="right-character-image" src="" alt="右侧角色">
    </div>

    <!-- 设置按钮 -->
    <button class="settings-btn" id="settings-btn">
        <span class="settings-icon">⚙️</span>
    </button>
    
    <!-- 设置菜单 -->
    <div class="settings-menu" id="settings-menu">
        <ul>
            <li><a href="0-0.html">新的游戏</a></li>
            <li><a href="save.html?action=save">保存存档</a></li>
            <li><a href="save.html?action=load">获取存档</a></li>
            <li><a href="about.html">关于我们</a></li>
            <li><a href="login.html">退出登录</a></li>
        </ul>
    </div>

    <!-- 对话区域 -->
    <div class="dialogue-container">
        <div class="name-bar" id="name-bar">
            <span id="character-name">角色名</span>
        </div>
        <div class="dialogue-box" id="dialogue-box">
            <p id="dialogue-text"></p>
        </div>
        <div class="continue-indicator">点击继续 ▼</div>
    </div>

    <script src="..\js\1-4.js"></script>
</body>
</html>
