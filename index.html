<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无畏重启：逆光之战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        
        .game-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2.5rem, 8vw, 6rem);
            text-align: center;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(255, 100, 100, 0.6),
                0 0 30px rgba(255, 50, 50, 0.4),
                0 0 40px rgba(255, 0, 0, 0.2);
            font-family: "Arial Black", Impact, sans-serif;
            letter-spacing: 2px;
            white-space: nowrap;
            opacity: 0;
            animation: fadeIn 2s forwards 0.5s;
        }

        
        .enter-prompt {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: clamp(1rem, 3vw, 1.5rem);
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            animation: pulse 3s infinite ease-in-out;
            opacity: 0;
            animation-delay: 2s;
            animation-fill-mode: forwards;
        }

        .enter-prompt small {
            display: block;
            margin-top: 10px;
            font-size: 0.8em;
        }

       
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        
        .fade-out {
            animation: fadeOut 1s forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>
    
    <div class="video-bg">
        <video autoplay muted loop playsinline>
            
            <source src="videos/瑞娜bgm完整.mp4" type="video/mp4">
        </video>
    </div>

    
    <h1 class="game-title">无畏重启：逆光之战</h1>

   
    <div class="enter-prompt">
        单击进入游戏
        <small>Click to start</small>
    </div>

    <script>
        
        document.body.addEventListener('click', function() {
            
            document.body.classList.add('fade-out');
            
            
            setTimeout(() => {
                
                window.location.href = "html/login.html";
            }, 1000);
        });

        const video = document.querySelector('video');
        video.preload = 'auto';
    </script>
</body>
</html>
